      // Fix for environments/sandboxed iframes where window.fetch has only a getter on Window prototype
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _fetch = typeof _rawFetch === 'function' ? function() { return _rawFetch.apply(window, arguments); } : _rawFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e1) {
          try {
            var _protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return _protoFetch;
              },
              set: function(fn) {
                _protoFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }
      })();

      // Prevent "Cannot read properties of undefined (reading 'miniProgram')" from WeChat / browser extensions
      (function() {
        try {
          var mockMiniProgram = {
            getEnv: function(cb) { if (typeof cb === 'function') cb({ miniprogram: false }); },
            navigateBack: function() {},
            navigateTo: function() {},
            redirectTo: function() {},
            switchTab: function() {},
            reLaunch: function() {},
            postMessage: function() {}
          };

          if (typeof window !== 'undefined') {
            if (!window.wx) {
              window.wx = { miniProgram: mockMiniProgram };
            } else if (!window.wx.miniProgram) {
              window.wx.miniProgram = mockMiniProgram;
            }
          }
          if (typeof globalThis !== 'undefined') {
            if (!globalThis.wx) {
              globalThis.wx = { miniProgram: mockMiniProgram };
            } else if (!globalThis.wx.miniProgram) {
              globalThis.wx.miniProgram = mockMiniProgram;
            }
          }

          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('miniProgram') !== -1) {
              e.preventDefault();
              e.stopPropagation();
              return true;
            }
          }, true);
        } catch (e) {}
      })();
    </script>
